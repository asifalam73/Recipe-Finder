<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/0b83a9bad7.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
    <header>
        <h1><i class="fas fa-utensils"></i>Recipe Finder</h1>
        <p>Find delicious recipes from around the world</p>
    </header>
    <p class="api-link">Data from <a href="https://www.themealdb.com/api.php">TheMealDB 👨‍🍳</a></p>
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search for meals or keywords">
        <button id="search-btn">Search</button>
    </div>

    <div id="error-container" class="hidden">
        <p>No meals found. try another search item!</p>
    </div>

    <div id="result-heading"></div>

    <div id="meals" class="meals-container"></div>

    <div id="meals-details" class="hidden">
        <button id="back-btn"><i class="fas fa-arrow-left"></i></button>

        <div class="meal-details-content"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
